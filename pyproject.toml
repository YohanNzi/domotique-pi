[project]
name = "domotique-pi"
version = "0.1.0"
description = "Collecteur de mesures maison (système, météo, réseau) pour Raspberry Pi → SQLite → Grafana"
readme = "README.md"
# Raspberry Pi OS Bookworm embarque Python 3.11 (tomllib requis).
requires-python = ">=3.11"
# Volontairement AUCUNE dépendance d'exécution : stdlib uniquement (urllib, sqlite3,
# subprocess, tomllib) — rien à compiler ni à installer sur un Pi 2 (1 Go RAM, ARMv7).
dependencies = []

[project.scripts]
domotique = "domotique.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domotique"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
